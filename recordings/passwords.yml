# The page guides/passwords. The named connection holds no password. With
# -w, usql does not ask for it and stops. Without -w, usql asks for it, and
# the secret step types it at the prompt, which does not show it. It needs
# the PostgreSQL server of docs/RECORDING.md, with the northwind fixture.
title: The password prompt of usql
size: 100x26
needs: [USQL_SITE_PG_NOPASSWORD, USQL_SITE_PG_PASSWORD]
files:
  .config/usql/config.yaml: |
    connections:
      pg: ${USQL_SITE_PG_NOPASSWORD}
steps:
  - type: usql -w pg
  - wait: "$ "
  - sleep: 2s
  - type: usql pg
  - wait: "Enter password: "
  - sleep: 1s
  - secret: USQL_SITE_PG_PASSWORD
  - wait: "=> "
  - sleep: 1s
  - type: select current_user;
  - wait: "=> "
  - sleep: 1.5s
  - type: \q
  - wait: "$ "
  - sleep: 500ms
