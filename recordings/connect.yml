# The page guides/connect. It opens PostgreSQL and MySQL by the names of
# their connections, and changes between the two with \c. It needs the
# servers of docs/RECORDING.md, with the northwind fixture.
title: Connect to PostgreSQL and MySQL
size: 100x26
needs: [USQL_SITE_PG, USQL_SITE_MY]
files:
  .config/usql/config.yaml: |
    connections:
      pg: ${USQL_SITE_PG}
      my: ${USQL_SITE_MY}
steps:
  - type: usql pg
  - wait: "=> "
  - sleep: 1s
  - type: select current_database(), current_user;
  - wait: "=> "
  - sleep: 1.5s
  - type: \c my
  - wait: "=> "
  - sleep: 1s
  - type: select database(), current_user();
  - wait: "=> "
  - sleep: 1.5s
  - type: \q
  - wait: "$ "
  - type: usql my -c "select count(*) as customers from customers"
  - wait: "$ "
  - sleep: 2s
