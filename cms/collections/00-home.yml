# The home page. Its template and its image are not in the editor.
name: home
label: Home page
files:
  - name: index
    label: Home page
    file: src/content/docs/index.md
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: template, label: Template, widget: hidden, default: splash }
      - name: hero
        label: Hero
        widget: object
        fields:
          - { name: tagline, label: Tagline, widget: text }
          - name: image
            label: Image
            widget: object
            fields:
              - { name: file, label: File, widget: hidden }
          - name: actions
            label: Buttons
            widget: list
            fields:
              - { name: text, label: Text, widget: string }
              - { name: link, label: Link, widget: string }
              - { name: icon, label: Icon, widget: string, required: false }
              - {
                  name: variant,
                  label: Style,
                  widget: select,
                  options: [primary, secondary, minimal],
                  required: false,
                }
      - { name: body, label: Body, widget: markdown }
